<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZyreX - Forgot Password</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>ZyreX</h1>
    <p class="sub">Reset your password</p>
    <div id="msg"></div>
    <div class="field"><label>Email</label><input type="email" id="email"></div>
    <button class="btn" id="sendBtn">Send Reset Link</button>
    <div class="linkrow"><a href="/index.html">Back to login</a></div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
document.getElementById('sendBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const r = await api('/api/auth/forgot', { email });
  showMsg(r.ok ? (r.message || 'Reset link sent') : r.error, r.ok);
};
</script>
</body>
</html>
