<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZyreX - Reset Password</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>ZyreX</h1>
    <p class="sub">Set a new password</p>
    <div id="msg"></div>
    <div class="field"><label>New Password</label><input type="password" id="password"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="confirmPassword"></div>
    <button class="btn" id="resetBtn">Reset Password</button>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const email = params.get('email');
document.getElementById('resetBtn').onclick = async () => {
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const r = await api('/api/auth/reset', { email, token, password, confirmPassword });
  if (r.ok) { showMsg('Password reset! Redirecting...', true); setTimeout(() => location.href = '/chat.html', 1200); }
  else showMsg(r.error, false);
};
</script>
</body>
</html>
